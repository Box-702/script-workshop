# =====================================================================
# docker-compose.yml —— 基础设施编排（应用在本机运行）
#
# 应用（FastAPI + Vue）在本机用 uvicorn / vite 直接跑，
# 这里只用 Docker 提供它依赖的基础设施：
#   postgres  业务数据（项目 / 版本 / Agent 运行记录）+ LangGraph checkpointer
#
# 可选（`docker compose --profile milvus up`）：
#   etcd / minio / milvus  -> 向量库，供 Agent 的 retrieve_source 工具做 RAG。
#   即使 Milvus 未启动，app 里的向量层也会自动退化为「内存向量 + 哈希嵌入」，
#   因此主流程不受影响 —— 这正是「RAG 可选」的设计。
# =====================================================================

services:
  # ---------- 业务数据库 + checkpointer ----------
  postgres:
    image: postgres:16-alpine
    container_name: script-agent-postgres
    environment:
      POSTGRES_USER: script
      POSTGRES_PASSWORD: script
      POSTGRES_DB: script_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U script -d script_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------- 可选 Milvus 向量栈（--profile milvus 时启动）----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: ["milvus"]
    container_name: script-agent-etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcddata:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["milvus"]
    container_name: script-agent-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      # 新版 MinIO 已把 MINIO_ACCESS_KEY/SECRET_KEY 更名为 ROOT_USER/ROOT_PASSWORD。
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/minio_data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.0
    profiles: ["milvus"]
    container_name: script-agent-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    # 等 etcd / minio 真正健康后再启动，避免 milvus 在依赖未就绪时 crash-loop。
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped


volumes:
  pgdata:
  etcddata:
  miniodata:
  milvusdata:
