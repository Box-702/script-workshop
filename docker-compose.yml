services:
  api:
    build: ./apps/api
    container_name: scriptforge-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/data:/app/data
      - ./apps/api/storage:/app/storage
    restart: unless-stopped

  web:
    build: ./apps/web
    container_name: scriptforge-web
    environment:
      - BACKEND_URL=http://api:8000
      - NEXT_PUBLIC_API_BASE=/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
