services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: script-workshop-api
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_MODE: local
      DATABASE_URL: sqlite:///./data/script-workshop.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/data:/app/data
      - ./apps/api/storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: script-workshop-web
    environment:
      - BACKEND_URL=http://api:8000
      - NEXT_PUBLIC_API_BASE=/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
