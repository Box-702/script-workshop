# =====================================================================
# docker-compose.yml —— 基础设施编排（应用在本机运行）
#
# 应用（FastAPI + Vue）在本机用 uvicorn / vite 直接跑，
# 这里只用 Docker 提供它依赖的基础设施：
#   postgres  业务数据（项目 / 版本 / Agent 运行记录）+ LangGraph checkpointer
# =====================================================================

services:
  # ---------- 业务数据库 + checkpointer ----------
  postgres:
    image: postgres:16-alpine
    container_name: script-agent-postgres
    environment:
      POSTGRES_USER: script
      POSTGRES_PASSWORD: script
      POSTGRES_DB: script_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U script -d script_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
