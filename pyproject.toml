# =====================================================================
# pyproject.toml —— 剧本智能体（Script Adaptation Agent）项目声明
#
# 这是一个用 LangGraph / LangChain 重构的「剧本改写智能体」工作台，
# 目标是做成一款能讲清楚、能投 Agent 开发岗的简历项目。
# 核心卖点：有状态图（StateGraph）、ReAct 工具调用、结构化输出、
# 人机协同（interrupt + Command.resume）、checkpointer 持久化。
#
# 版本策略：
#   - 明确锁定到 LangChain v1 / LangGraph v1 的 API，避免 0.x 旧接口。
#   - 所有依赖都选择「OpenAI 兼容 + 无 key 可回退」路径，保证离线也能跑。
# =====================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "script-agent"
version = "0.2.0"
description = "基于 LangGraph 的剧本改写智能体 —— 核心 Agent 工作台（简历项目）"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Script Workshop" }]
dependencies = [
    # ---- LangGraph 状态图 / 预构建组件 / checkpoint ----
    "langgraph>=1.2,<1.3",
    "langgraph-prebuilt>=1.1,<1.2",
    # Postgres checkpointer：跨请求 / 跨重启恢复被 interrupt 暂停的图。
    "langgraph-checkpoint-postgres>=3.1,<4",
    # ---- LangChain 核心与模型接入 ----
    "langchain-core>=1.6,<1.7",
    "langchain-openai>=1.6,<1.7",       # 任意 OpenAI 兼容服务（OpenAI/DeepSeek/Qwen 等）
    "langchain-deepseek>=1.1,<1.2",     # DeepSeek 原生适配（可选，便于演示）
    "langchain>=1.3,<1.4",
    "langchain-text-splitters>=1.1,<1.2",
    # ---- 数据 / 向量 / 配置 / Web ----
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",             # Postgres 驱动（业务库 + checkpointer）
    "pymilvus>=2.4",                    # 可选 Milvus 向量库（RAG）
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[project.scripts]
script-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
